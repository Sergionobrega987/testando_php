{% extends 'base.html' %}
{% block conteudo %}
<div class="row">
     {% for post in posts%}     
        <div class="col-md-3">     
            <div class="card m-4">
                <div class="card-body">
                    <h5 class="card-title">{{post.titulo}}</h5>
                        <p class="card-text">{{post.texto}}</p>
                
                </div>
            </div>
            
        </div>  
     {%endfor%}
</div>
{% endblock %}
